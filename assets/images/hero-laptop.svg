<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff8a1a"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232b"/><stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/><stop offset=".35" stop-color="#1b1b21"/><stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="scr" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#3a2a08"/><stop offset=".45" stop-color="#14110a"/><stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc21a" stop-opacity=".55"/><stop offset="1" stop-color="#ffc21a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- gold glow + floor shadow -->
  <ellipse cx="400" cy="300" rx="380" ry="230" fill="url(#glow)"/>
  <ellipse cx="400" cy="508" rx="330" ry="20" fill="#000" opacity=".6"/>
  <ellipse cx="400" cy="506" rx="260" ry="9" fill="#ffc21a" opacity=".35"/>

  <!-- lid -->
  <rect x="96" y="26" width="608" height="394" rx="26" fill="url(#lid)" stroke="url(#gold)" stroke-width="3"/>
  <rect x="118" y="48" width="564" height="350" rx="12" fill="url(#scr)"/>

  <!-- screen UI (abstract, brand logo is overlaid in HTML) -->
  <g opacity=".9">
    <circle cx="140" cy="66" r="4" fill="#ff5f57"/><circle cx="156" cy="66" r="4" fill="#ffbd2e"/><circle cx="172" cy="66" r="4" fill="#28c840"/>
    <rect x="132" y="92" width="64" height="10" rx="5" fill="#ffffff" opacity=".16"/>
    <rect x="132" y="116" width="48" height="8" rx="4" fill="#ffffff" opacity=".09"/>
    <rect x="132" y="136" width="56" height="8" rx="4" fill="#ffffff" opacity=".09"/>
    <rect x="132" y="156" width="40" height="8" rx="4" fill="#ffffff" opacity=".09"/>
    <rect x="132" y="176" width="52" height="8" rx="4" fill="#ffffff" opacity=".09"/>
    <!-- right tiles -->
    <rect x="590" y="88" width="76" height="76" rx="14" fill="none" stroke="#ffc21a" stroke-opacity=".35"/>
    <rect x="590" y="176" width="76" height="76" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="590" y="264" width="76" height="76" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="628" cy="126" r="16" fill="none" stroke="#ffc21a" stroke-width="2"/>
    <path d="M612 214 l16-22 l16 22 z" fill="none" stroke="#ffc21a" stroke-opacity=".7" stroke-width="2"/>
    <rect x="612" y="288" width="32" height="28" rx="6" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
    <!-- bezier pen path -->
    <path d="M216 330 C 300 250, 360 360, 450 300 S 560 280, 574 334" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <g fill="#08080a" stroke="#ffc21a" stroke-width="2">
      <rect x="211" y="325" width="10" height="10" rx="2"/><rect x="445" y="295" width="10" height="10" rx="2"/><rect x="569" y="329" width="10" height="10" rx="2"/>
    </g>
    <!-- bottom bar -->
    <rect x="216" y="366" width="360" height="10" rx="5" fill="#ffffff" opacity=".08"/>
    <rect x="216" y="366" width="210" height="10" rx="5" fill="url(#gold)" opacity=".8"/>
  </g>
  <!-- screen gloss -->
  <path d="M118 48 H520 L300 398 H118 Z" fill="url(#gloss)"/>
  <circle cx="400" cy="37" r="3" fill="#ffc21a" opacity=".8"/>

  <!-- base -->
  <path d="M40 420 H760 L790 468 Q796 492 770 494 H30 Q4 492 10 468 Z" fill="url(#base)" stroke="url(#gold)" stroke-width="1.5" stroke-opacity=".7"/>
  <path d="M40 421 H760" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M330 420 H470 Q462 438 440 438 H360 Q338 438 330 420 Z" fill="#050507" stroke="#ffc21a" stroke-opacity=".4"/>
  <rect x="270" y="466" width="260" height="14" rx="7" fill="#0a0a0d" opacity=".9"/>
</svg>
